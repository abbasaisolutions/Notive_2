name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: write so a successful build can tag the released versionCode. That tag
# is the durable record of "this version has shipped", and the guard below reads it.
permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://notive.abbasaisolutions.com' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://notive2-production.up.railway.app/api/v1' }}
      NEXT_PUBLIC_NATIVE_API_URL: ${{ vars.NEXT_PUBLIC_NATIVE_API_URL || 'https://notive2-production.up.railway.app/api/v1' }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '1234567890-abcdefghijklmnop.apps.googleusercontent.com' }}
      NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID || '1234567890-abcdefghijklmnop.apps.googleusercontent.com' }}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL || 'support@notive.app' }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Tags are the released-version ledger the guard below checks.
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Install frontend dependencies
        run: npm install

      - name: Restore Android signing keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/notive-upload-key.jks"
          if [[ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" ]]; then
            printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --ignore-garbage --decode > "$KEYSTORE_PATH"
            echo "PLAY_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "Restored Android signing keystore from GitHub secret."
            exit 0
          fi

          if [[ -f android/keystore/notive-upload-key.jks ]]; then
            echo "PLAY_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/frontend/android/keystore/notive-upload-key.jks" >> "$GITHUB_ENV"
            echo "Using checked-in Android signing keystore."
            exit 0
          fi

          echo "Missing signing keystore secret and no checked-in keystore was found." >&2
          exit 1

      # The version comes from frontend/android/gradle.properties and nowhere else,
      # so a local `gradlew bundleRelease` and this workflow produce the same build.
      - name: Read Android release version
        id: version
        run: npm run android:version:read -- --github-output

      # This workflow runs on every push to main, but most commits are not releases.
      # A version code that has already been tagged is skipped, not failed — otherwise
      # every ordinary commit would turn CI red. To cut a release, bump the version
      # (`npm run android:version:patch`), commit, and push.
      - name: Decide whether this is a new release
        id: guard
        working-directory: ${{ github.workspace }}
        run: |
          TAG="android-v${{ steps.version.outputs.versionCode }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::versionCode ${{ steps.version.outputs.versionCode }} already shipped as $TAG — skipping the Android build. Bump with 'npm run android:version:patch' to cut a new release."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Building Notive Android ${{ steps.version.outputs.versionName }} (${{ steps.version.outputs.versionCode }})."
          fi

      - name: Build signed Android release bundle
        if: steps.guard.outputs.should_build == 'true'
        run: |
          npm run android:ready
          npm run android:prepare
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Android release artifact
        if: steps.guard.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notive-android-${{ steps.version.outputs.versionName }}-${{ github.sha }}
          path: |
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            frontend/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      # Burns the version code so it cannot be built twice. Runs only after a
      # successful build, so a failed run leaves the version free to retry.
      - name: Tag the released version
        if: steps.guard.outputs.should_build == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          TAG="android-v${{ steps.version.outputs.versionCode }}"
          git tag -a "$TAG" -m "Notive Android ${{ steps.version.outputs.versionName }} (${{ steps.version.outputs.versionCode }})"
          git push origin "refs/tags/$TAG"
